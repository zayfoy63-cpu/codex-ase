<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Codex Interne — Hébergement ESMS ASE 93</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f6fa;color:#222;min-height:100vh}
header{background:#1a3a5c;color:#fff;padding:0}
.header-inner{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 20px}
.header-title{font-size:16px;font-weight:600;letter-spacing:.3px}
.header-sub{font-size:12px;color:#bdd5ee;margin-top:2px}
.header-right{display:flex;gap:8px;align-items:center}
.main{max-width:900px;margin:0 auto;padding:20px}
.banner{background:#e8f0f7;border-left:3px solid #2e6da4;border-radius:6px;padding:10px 14px;margin-bottom:18px;font-size:13px;color:#0c447c;display:flex;align-items:center;gap:8px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.topbar-title{font-size:18px;font-weight:600;color:#1a3a5c}
.section-card{background:#fff;border:1px solid #e0e4ec;border-radius:10px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.sec-header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#f8f9fc;cursor:pointer;user-select:none;border-bottom:1px solid transparent;transition:background .15s}
.sec-header:hover{background:#eef2f8}
.sec-header.open{border-bottom-color:#e0e4ec}
.sec-num{width:30px;height:30px;border-radius:50%;background:#2e6da4;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sec-title-input{flex:1;font-size:14px;font-weight:600;border:none;background:transparent;color:#1a3a5c;outline:none;cursor:text}
.sec-title-input:focus{background:#fff;border-radius:4px;padding:2px 6px}
.sec-actions{display:flex;gap:5px}
.btn{border:1px solid #dde1ea;background:#fff;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;color:#444;transition:background .15s}
.btn:hover{background:#f0f2f7}
.btn.primary{background:#1a3a5c;color:#fff;border-color:#1a3a5c}
.btn.primary:hover{background:#2e6da4;border-color:#2e6da4}
.btn.danger{color:#c0392b;border-color:#f5c6c2}
.btn.danger:hover{background:#fdecea}
.btn.sm{padding:3px 8px;font-size:11px}
.sec-body{padding:14px 16px}
.sec-desc{background:#f8f9fc;border-left:2px solid #b5d4f4;border-radius:4px;padding:6px 10px;margin-bottom:12px}
.sec-desc textarea{width:100%;font-size:12px;color:#666;font-style:italic;border:none;background:transparent;outline:none;resize:none;font-family:inherit;line-height:1.5}
.notions-list{margin-bottom:10px}
.notion-row{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:1px solid #f0f2f7}
.notion-row:last-child{border-bottom:none}
.notion-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:7px;transition:background .2s}
.notion-dot.normal{background:#2e6da4}
.notion-dot.todo{background:#e6ac00}
.notion-textarea{flex:1;font-size:13px;border:none;background:transparent;outline:none;resize:none;font-family:inherit;line-height:1.5;min-height:20px;color:#222}
.notion-textarea.todo{color:#795500;font-style:italic}
.notion-del{opacity:0;transition:opacity .15s;border:none;background:none;cursor:pointer;color:#c0392b;font-size:13px;padding:2px 4px}
.notion-row:hover .notion-del{opacity:1}
.add-notion-btn{font-size:12px;color:#888;border:none;background:none;cursor:pointer;padding:4px 0;display:flex;align-items:center;gap:4px;margin-top:2px}
.add-notion-btn:hover{color:#1a3a5c}
.divider{border:none;border-top:1px solid #eef0f5;margin:12px 0}
.attach-label{font-size:12px;font-weight:600;color:#888;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.drop-zone{border:1.5px dashed #c5cfe0;border-radius:8px;padding:12px;text-align:center;cursor:pointer;transition:background .15s,border-color .15s}
.drop-zone:hover,.drop-zone.over{background:#e8f0f7;border-color:#2e6da4}
.drop-label{font-size:12px;color:#888}
.file-list{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.file-item{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#f8f9fc;border:1px solid #e8eaf0;border-radius:6px}
.file-icon{font-size:16px;flex-shrink:0}
.file-name{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#333}
.file-size{font-size:11px;color:#888;flex-shrink:0}
.file-del{opacity:0;border:none;background:none;cursor:pointer;color:#c0392b;font-size:12px;transition:opacity .15s}
.file-item:hover .file-del{opacity:1}
.link-row{display:flex;gap:6px;margin-top:6px}
.link-input{flex:1;font-size:12px;padding:6px 10px;border:1px solid #dde1ea;border-radius:6px;background:#f8f9fc;color:#222;outline:none;font-family:inherit}
.link-input:focus{border-color:#2e6da4;background:#fff}
.link-item{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#f8f9fc;border:1px solid #e8eaf0;border-radius:6px;margin-top:4px}
.link-item a{flex:1;font-size:12px;color:#2e6da4;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-item a:hover{text-decoration:underline}
.link-del{opacity:0;border:none;background:none;cursor:pointer;color:#c0392b;font-size:12px;transition:opacity .15s}
.link-item:hover .link-del{opacity:1}
.status-bar{text-align:center;font-size:12px;color:#888;margin-top:16px;min-height:18px}
.loading{text-align:center;padding:3rem;color:#888;font-size:14px}
.add-section-btn{width:100%;padding:10px;border:1.5px dashed #c5cfe0;background:transparent;border-radius:10px;font-size:13px;color:#888;cursor:pointer;transition:all .15s;margin-bottom:12px}
.add-section-btn:hover{border-color:#2e6da4;color:#2e6da4;background:#f0f5fc}
.save-indicator{font-size:11px;color:#fff;opacity:.7}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div>
      <div class="header-title">Codex Interne — Hébergement ESMS</div>
      <div class="header-sub">Comptabilité ASE — Conseil Départemental de Seine-Saint-Denis (93)</div>
    </div>
    <div class="header-right">
      <span class="save-indicator" id="saveIndicator"></span>
      <button class="btn primary" onclick="saveAll()">💾 Sauvegarder</button>
    </div>
  </div>
</header>

<div class="main">
  <div class="banner">
    📢 Outil partagé — toutes les modifications sont visibles par tous les utilisateurs.
  </div>

  <div class="topbar">
    <div class="topbar-title">Sections du Codex</div>
  </div>

  <div id="sections-root"><div class="loading">⏳ Chargement...</div></div>

  <button class="add-section-btn" onclick="addSection()">+ Ajouter une section</button>

  <div class="status-bar" id="statusBar"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// ── CONFIG FIREBASE ────────────────────────────────────────────────
const firebaseConfig = {
  databaseURL: "https://codex-ase93-default-rtdb.europe-west1.firebasedatabase.app"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);
const dbRef = ref(db, "codex");

// ── DONNÉES PAR DÉFAUT ─────────────────────────────────────────────
const DEFAULT = {
  sections: [
    { id:1, title:"Procédure de traitement d'une facture", desc:"Vérification encodage > période PEC > saisie IODAS > date effet > paiement", open:true,
      notions:[
        {id:1,text:"Vérifier que l'encodage est présent et complet dans IODAS"},
        {id:2,text:"Contrôler la cohérence entre la période facturée et la PEC"},
        {id:3,text:"Saisir sur IODAS après validation des vérifications"},
        {id:4,text:"Appliquer la date d'effet de paiement [À compléter avec le service]"},
        {id:5,text:"Procéder au paiement [À compléter avec le service]"},
      ], files:[], links:[] },
    { id:2, title:"Problèmes fréquents & comment les résoudre", desc:"Encodage manquant, période non conforme, RIB erroné, problème date effet paiement...", open:true,
      notions:[
        {id:1,text:"Encodage absent ou incomplet : relancer le groupement (section 03)"},
        {id:2,text:"Période facture ≠ PEC : retourner au groupement pour correction"},
        {id:3,text:"RIB non à jour : demander RIB à jour + transmettre au service RIB"},
        {id:4,text:"Problème de date d'effet paiement : [À compléter avec le service]"},
        {id:5,text:"Mauvais interlocuteur contacté : consulter la section 05"},
      ], files:[], links:[] },
    { id:3, title:"Procédure de relance groupement", desc:"À étoffer avec l'outil de suivi — à définir avec le service", open:true,
      notions:[
        {id:1,text:"Identifier la facture bloquée : établissement, dossier ASE, période, motif"},
        {id:2,text:"1ère relance par email au référent du groupement"},
        {id:3,text:"Reporter dans l'outil de suivi des relances [outil à créer]"},
        {id:4,text:"2ème relance si pas de réponse [délai à définir] — responsable en copie"},
        {id:5,text:"Définir avec le service : pilotage interne ou délégation groupement [À trancher]"},
      ], files:[], links:[] },
    { id:4, title:"Glossaire", desc:"Termes et définitions — section évolutive, facile à mettre à jour", open:true,
      notions:[
        {id:1,text:"Encodage : saisie informatique des lignes de facturation dans IODAS par le groupement"},
        {id:2,text:"PEC (Prise en charge) : document ASE autorisant le placement d'un enfant"},
        {id:3,text:"Groupement : structure regroupant plusieurs établissements saisissant les encodages"},
        {id:4,text:"ESMS : Établissement ou Service Médico-Social"},
        {id:5,text:"RIB : Relevé d'Identité Bancaire du prestataire"},
        {id:6,text:"IODAS : logiciel de gestion ASE pour les dossiers et la facturation"},
        {id:7,text:"Date d'effet : [À définir avec le service]"},
        {id:8,text:"Mandatement : [À définir avec le service]"},
      ], files:[], links:[] },
    { id:5, title:"Contacts & documents utiles", desc:"Fichiers Excel, tableaux de bord, PDF de référence, contacts référents", open:true,
      notions:[
        {id:1,text:"Gestionnaire comptable : [email] | Permanence : [numéro à renseigner]"},
        {id:2,text:"Groupements — référents par établissement : [liste à renseigner]"},
        {id:3,text:"Responsable comptabilité hébergement : [email à renseigner]"},
        {id:4,text:"Service RIB (mise à jour) : [email / contact à renseigner]"},
        {id:5,text:"Tableau de bord suivi factures : [lien SharePoint à coller]"},
        {id:6,text:"Outil suivi relances : [lien à renseigner quand créé]"},
      ], files:[], links:[] },
  ],
  nsi: 6, nni: 200
};

// ── STATE ──────────────────────────────────────────────────────────
let state = null;
let saving = false;
const linkInputs = {};

function isACompleter(text) {
  return /\[À (compléter|définir|trancher)|outil à créer|délai à définir|liste à|lien (Share|à)|email|numéro à/i.test(text);
}

function iconFor(name) {
  const e = (name||"").split(".").pop().toLowerCase();
  if(["xlsx","xls","csv"].includes(e)) return "📊";
  if(e==="pdf") return "📄";
  if(["docx","doc"].includes(e)) return "📝";
  if(["png","jpg","jpeg","gif"].includes(e)) return "🖼️";
  return "📎";
}

function fmtSize(b) {
  if(!b) return "";
  if(b<1024) return b+"B";
  if(b<1048576) return Math.round(b/1024)+"KB";
  return (b/1048576).toFixed(1)+"MB";
}

function numStr(i) { return String(i+1).padStart(2,"0"); }

function setStatus(msg, dur=2500) {
  const el = document.getElementById("statusBar");
  el.textContent = msg;
  if(dur) setTimeout(()=>{ if(el.textContent===msg) el.textContent=""; }, dur);
}

// ── FIREBASE ───────────────────────────────────────────────────────
onValue(dbRef, snap => {
  const val = snap.val();
  state = val || JSON.parse(JSON.stringify(DEFAULT));
  render();
});

window.saveAll = async function() {
  if(!state || saving) return;
  saving = true;
  document.getElementById("saveIndicator").textContent = "Sauvegarde...";
  try {
    await set(dbRef, state);
    document.getElementById("saveIndicator").textContent = "✓ Sauvegardé";
    setTimeout(()=>{ document.getElementById("saveIndicator").textContent=""; }, 2000);
  } catch(e) {
    setStatus("Erreur : "+e.message);
  }
  saving = false;
};

function autoSave() {
  if(!state) return;
  set(dbRef, state).catch(()=>{});
}

// ── RENDER ─────────────────────────────────────────────────────────
function render() {
  const root = document.getElementById("sections-root");
  if(!state){ root.innerHTML='<div class="loading">⏳ Chargement...</div>'; return; }
  root.innerHTML = "";

  state.sections.forEach((sec, si) => {
    if(!sec.files) sec.files=[];
    if(!sec.links) sec.links=[];

    const card = document.createElement("div");
    card.className = "section-card";

    // HEADER
    const head = document.createElement("div");
    head.className = "sec-header" + (sec.open?" open":"");

    const num = document.createElement("div");
    num.className = "sec-num";
    num.textContent = numStr(si);

    const ti = document.createElement("input");
    ti.className = "sec-title-input";
    ti.value = sec.title;
    ti.setAttribute("aria-label","Titre section");
    ti.onclick = e => e.stopPropagation();
    ti.oninput = e => { sec.title = e.target.value; };
    ti.onblur = () => autoSave();

    const acts = document.createElement("div");
    acts.className = "sec-actions";
    acts.onclick = e => e.stopPropagation();

    if(si>0){ const b=mkBtn("↑","sm",()=>{ state.sections.splice(si,1);state.sections.splice(si-1,0,sec);autoSave();render(); },"Monter"); acts.appendChild(b); }
    if(si<state.sections.length-1){ const b=mkBtn("↓","sm",()=>{ state.sections.splice(si,1);state.sections.splice(si+1,0,sec);autoSave();render(); },"Descendre"); acts.appendChild(b); }
    const db=mkBtn("✕","sm danger",()=>{ if(confirm("Supprimer cette section ?")){ state.sections.splice(si,1);autoSave();render(); } },"Supprimer");
    acts.appendChild(db);
    const tog=mkBtn(sec.open?"▾":"▸","sm",()=>{ sec.open=!sec.open;render(); },sec.open?"Replier":"Déplier");
    acts.appendChild(tog);

    head.appendChild(num); head.appendChild(ti); head.appendChild(acts);
    head.onclick = () => { sec.open=!sec.open; render(); };
    card.appendChild(head);

    if(sec.open) {
      const body = document.createElement("div");
      body.className = "sec-body";

      // Description
      const descBox = document.createElement("div");
      descBox.className = "sec-desc";
      const descTA = document.createElement("textarea");
      descTA.value = sec.desc||"";
      descTA.rows = 1;
      descTA.placeholder = "Sous-titre / description...";
      descTA.setAttribute("aria-label","Description");
      descTA.oninput = e => { sec.desc=e.target.value; autoGrow(e.target); };
      descTA.onblur = () => autoSave();
      descBox.appendChild(descTA);
      body.appendChild(descBox);

      // Notions
      const nl = document.createElement("div");
      nl.className = "notions-list";
      (sec.notions||[]).forEach((n,ni)=>{
        const row = document.createElement("div");
        row.className = "notion-row";
        const dot = document.createElement("div");
        dot.className = "notion-dot " + (isACompleter(n.text)?"todo":"normal");
        const ta = document.createElement("textarea");
        ta.className = "notion-textarea" + (isACompleter(n.text)?" todo":"");
        ta.value = n.text; ta.rows=1;
        ta.setAttribute("aria-label","Notion");
        ta.oninput = e => { n.text=e.target.value; dot.className="notion-dot "+(isACompleter(n.text)?"todo":"normal"); ta.className="notion-textarea"+(isACompleter(n.text)?" todo":""); autoGrow(e.target); };
        ta.onblur = () => autoSave();
        const del = document.createElement("button");
        del.className = "notion-del";
        del.textContent = "✕";
        del.setAttribute("aria-label","Supprimer notion");
        del.onclick = ()=>{ sec.notions.splice(ni,1); autoSave(); render(); };
        row.appendChild(dot); row.appendChild(ta); row.appendChild(del);
        nl.appendChild(row);
      });
      body.appendChild(nl);

      const addN = document.createElement("button");
      addN.className = "add-notion-btn";
      addN.innerHTML = "+ Ajouter une notion";
      addN.onclick = ()=>{ sec.notions.push({id:state.nni++,text:""}); autoSave(); render(); setTimeout(()=>{ const tas=nl.querySelectorAll("textarea"); if(tas.length) tas[tas.length-1].focus(); },50); };
      body.appendChild(addN);

      // Séparateur
      const hr = document.createElement("hr");
      hr.className = "divider";
      body.appendChild(hr);

      // Fichiers & liens
      const al = document.createElement("div");
      al.className = "attach-label";
      al.innerHTML = "📎 Fichiers & liens";
      body.appendChild(al);

      // Drop zone
      const dz = document.createElement("div");
      dz.className = "drop-zone";
      dz.setAttribute("role","button");
      dz.setAttribute("aria-label","Déposer un fichier");
      dz.innerHTML = '<div class="drop-label">📤 Déposer un fichier ici ou <u>cliquer pour sélectionner</u></div>';
      const fi = document.createElement("input");
      fi.type="file"; fi.multiple=true; fi.style.display="none";
      fi.onchange = e => handleFiles(e.target.files, sec);
      body.appendChild(fi);
      dz.onclick = ()=> fi.click();
      dz.ondragover = e=>{ e.preventDefault(); dz.classList.add("over"); };
      dz.ondragleave = ()=> dz.classList.remove("over");
      dz.ondrop = e=>{ e.preventDefault(); dz.classList.remove("over"); handleFiles(e.dataTransfer.files,sec); };
      body.appendChild(dz);

      // Liste fichiers
      const fl = document.createElement("div");
      fl.className = "file-list";
      (sec.files||[]).forEach((f,fi2)=>{
        const item=document.createElement("div"); item.className="file-item";
        const ic=document.createElement("span"); ic.className="file-icon"; ic.textContent=iconFor(f.name);
        const nm=document.createElement("span"); nm.className="file-name"; nm.title=f.name; nm.textContent=f.name;
        const sz=document.createElement("span"); sz.className="file-size"; sz.textContent=fmtSize(f.size);
        const d=document.createElement("button"); d.className="file-del"; d.textContent="✕"; d.setAttribute("aria-label","Supprimer fichier");
        d.onclick=()=>{ sec.files.splice(fi2,1); autoSave(); render(); };
        item.appendChild(ic); item.appendChild(nm); item.appendChild(sz); item.appendChild(d);
        fl.appendChild(item);
      });
      body.appendChild(fl);

      // Lien
      const lr = document.createElement("div");
      lr.className = "link-row";
      const linp = document.createElement("input");
      linp.type="text"; linp.className="link-input";
      linp.value = linkInputs[sec.id]||"";
      linp.placeholder = "Coller un lien SharePoint ou URL puis Entrée...";
      linp.oninput = e=>{ linkInputs[sec.id]=e.target.value; };
      linp.onkeydown = e=>{ if(e.key==="Enter") addLink(sec); };
      const ladd=mkBtn("Ajouter","",()=>addLink(sec));
      lr.appendChild(linp); lr.appendChild(ladd);
      body.appendChild(lr);

      (sec.links||[]).forEach((lk,li)=>{
        const item=document.createElement("div"); item.className="link-item";
        const ic=document.createElement("span"); ic.textContent="🔗"; ic.style.flexShrink=0;
        const a=document.createElement("a"); a.href=lk.url; a.target="_blank"; a.rel="noopener";
        a.textContent=lk.label||lk.url;
        const d=document.createElement("button"); d.className="link-del"; d.textContent="✕"; d.setAttribute("aria-label","Supprimer lien");
        d.onclick=()=>{ sec.links.splice(li,1); autoSave(); render(); };
        item.appendChild(ic); item.appendChild(a); item.appendChild(d);
        body.appendChild(item);
      });

      card.appendChild(body);
    }
    root.appendChild(card);
  });
}

function addLink(sec) {
  const url = (linkInputs[sec.id]||"").trim();
  if(!url) return;
  const label = url.replace(/^https?:\/\/(www\.)?/,"").split("/").slice(0,3).join("/");
  if(!sec.links) sec.links=[];
  sec.links.push({url,label});
  linkInputs[sec.id]="";
  autoSave(); render();
}

function handleFiles(files, sec) {
  if(!sec.files) sec.files=[];
  Array.from(files).forEach(f=>{ sec.files.push({name:f.name,size:f.size,type:f.type}); });
  autoSave(); render();
  setStatus("✓ Fichier(s) ajouté(s)");
}

window.addSection = function() {
  if(!state) return;
  state.sections.push({id:state.nsi++,title:"Nouvelle section",desc:"",open:true,notions:[{id:state.nni++,text:""}],files:[],links:[]});
  autoSave(); render();
  setTimeout(()=>{ const ins=document.querySelectorAll(".sec-title-input"); if(ins.length) ins[ins.length-1].focus(); },50);
};

function mkBtn(label,cls,fn,aria) {
  const b=document.createElement("button");
  b.className="btn "+(cls||"");
  b.textContent=label;
  if(aria) b.setAttribute("aria-label",aria);
  b.onclick=fn; return b;
}

function autoGrow(el) {
  el.style.height="auto";
  el.style.height=el.scrollHeight+"px";
}
</script>
</body>
</html>
